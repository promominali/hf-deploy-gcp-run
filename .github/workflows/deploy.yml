name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: fullstackpro-python
  REGION: us-central1
  SERVICE_NAME: huggingface-small
  REPO: huggingface-repo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # Authenticate with GCP using a service account key
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true

      # Enable Docker auth for Artifact Registry
      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # Build image for linux/amd64
      - name: Build Docker image
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$SERVICE_NAME:latest"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker buildx build --platform linux/amd64 -t "$IMAGE" .

      # Push image
      - name: Push Docker image
        run: |
          docker push "$IMAGE"

      # Deploy to Cloud Run
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --image "$IMAGE" \
            --platform managed \
            --region "$REGION" \
            --allow-unauthenticated
